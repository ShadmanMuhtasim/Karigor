name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'tests/**'
      - 'scripts/run-security-tests.py'
      - 'scripts/tests/**'
      - 'Karigor.slnx'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'database/**'
      - 'tests/**'
      - 'scripts/run-security-tests.py'
      - 'scripts/tests/**'
      - 'Karigor.slnx'
      - '.github/workflows/backend-ci.yml'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'FixtureOnly_Karigor2026!'
        ports:
          - 1433:1433
    env:
      # Public fixture credential for this disposable CI service only.
      KARIGOR_TEST_SQLSERVER: 'Server=127.0.0.1,1433;Initial Catalog=master;User ID=sa;Password=FixtureOnly_Karigor2026!;TrustServerCertificate=true;Connect Timeout=5'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore Karigor.slnx

      - name: 🏗️ Build solution
        run: dotnet build Karigor.slnx --no-restore --configuration Release

      - name: Verify security result classifier
        run: python -m unittest discover -s scripts/tests -v

      - name: Run security baseline and executed known-defect regressions
        run: python scripts/run-security-tests.py --no-build

      - name: Upload raw security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-results
          path: TestResults/security/
          if-no-files-found: warn

      - name: 📊 Check for warnings
        run: |
          dotnet build Karigor.slnx --no-restore --configuration Release
          echo "✅ Backend build completed with 0 errors"

      - name: ✅ Verify build output
        run: |
          echo "✅ Backend CI completed successfully!"
          echo "📁 Built artifacts:"
          ls -la backend/*/bin/Release/net10.0/ || echo "No Release folder found (this is OK for now)"
