name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'karigor-client/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'karigor-client/**'
      - '.github/workflows/frontend-ci.yml'

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'karigor-client/package-lock.json'

      - name: 📦 Install dependencies
        run: |
          cd karigor-client
          npm ci

      - name: 🏗️ Build frontend
        run: |
          cd karigor-client
          npm run build

      - name: 📊 TypeScript check
        run: |
          cd karigor-client
          npx tsc --noEmit

      - name: ✅ Verify build output
        run: |
          echo "✅ Frontend build completed successfully!"
          echo "📁 Built artifacts:"
          ls -la karigor-client/dist/ || echo "dist folder not found (check build output)"

      - name: 💾 Upload build artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: karigor-client/dist/
          retention-days: 7